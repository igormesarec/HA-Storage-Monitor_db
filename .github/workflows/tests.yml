name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Run offline tests
        run: python -m pytest -q tests
      - name: Check dashboard JavaScript
        run: node --check custom_components/ha_storage_monitor/frontend/storage-monitor-card.js
      - name: Install frontend test dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend DOM tests
        run: pnpm test:frontend
